# La app de iPhone sin firmar (Entreno-<versión>.ipa), compilada en un Mac de GitHub: gratis en un
# repositorio público. La firma la pone SideStore en el propio iPhone con un Apple ID gratuito
# (AGENTS.md, «iPhone»). Se lanza a mano (Actions → iOS → Run workflow) o con una etiqueta ios-*.
name: iOS

on:
  workflow_dispatch:
  push:
    tags: ['ios-*']

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  ipa:
    # Estándar (no -large ni -xlarge): las de pago se cobran también en repos públicos.
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Expo SDK 58 pide Xcode 26.4 o posterior.
      - name: Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app || true
          xcodebuild -version

      - name: Dependencias
        run: npm ci 2>&1 | tee npm.log

      - name: Proyecto de iOS
        run: npx expo prebuild --platform ios --no-install 2>&1 | tee prebuild.log

      - name: CocoaPods
        run: cd ios && pod install 2>&1 | tee ../pod.log

      - name: Compilar sin firmar
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Workspace $WORKSPACE, esquema $SCHEME"
          # Todo a build.log (son decenas de miles de líneas); al final, su cola.
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -archivePath build/app.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive > build.log 2>&1 || { tail -200 build.log; exit 1; }
          tail -20 build.log

      - name: Empaquetar el .ipa
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          APP=$(ls -d build/app.xcarchive/Products/Applications/*.app | head -1)
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          (cd dist && zip -qry "Entreno-$VERSION.ipa" Payload)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          ls -la dist

      # Lo que no se ve sin abrir el .ipa, como anotaciones (el registro pide iniciar sesión; las
      # anotaciones no): el módulo propio registrado, la clave de las copias en el binario, y el Info.plist.
      - name: Comprobar el .ipa
        run: |
          APP=$(ls -d build/app.xcarchive/Products/Applications/*.app | head -1)
          PLIST="$APP/Info.plist"
          BIN="$APP/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$PLIST")"
          if grep -rqs "RestTimerModule" ios/Pods/Target\ Support\ Files/*/ExpoModulesProvider.swift; then
            echo "::notice title=Módulo propio::RestTimerModule registrado en ExpoModulesProvider"
          else
            echo "::warning title=Módulo propio::RestTimerModule no aparece en ExpoModulesProvider"
          fi
          # Swift guarda dentro del código las cadenas de 15 bytes o menos («pbkdf2Sha256»): se busca
          # el mensaje de error del módulo, que es más largo.
          if strings "$BIN" | grep -q "No se pudo calcular la clave de las copias"; then
            echo "::notice title=Clave de las copias::RestTimerModule.swift está en el binario"
          else
            echo "::warning title=Clave de las copias::RestTimerModule.swift no está en el binario"
          fi
          # La Actividad en directo (1.5.7): su extensión dentro de la app y la clave que la permite.
          if ls -d "$APP"/PlugIns/*.appex >/dev/null 2>&1; then
            echo "::notice title=Extensiones::$(cd "$APP/PlugIns" && ls -d *.appex | tr '\n' ' ')· NSSupportsLiveActivities $(/usr/libexec/PlistBuddy -c 'Print :NSSupportsLiveActivities' "$PLIST" 2>/dev/null || echo 'no')"
          else
            echo "::warning title=Extensiones::La app no lleva ninguna extensión (falta la de la Actividad en directo)"
          fi
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")
          MODES=$(/usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' "$PLIST" 2>/dev/null | tr -s ' \n' ' ')
          echo "::notice title=Info.plist::$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST") $VERSION ($BUILD), MinimumOSVersion $(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$PLIST"), UIBackgroundModes$MODES"

      - uses: actions/upload-artifact@v7
        with:
          name: Entreno-${{ env.VERSION }}-ios
          path: dist/*.ipa
          # Se borra pronto: el repositorio es público y no hace falta guardarlo.
          retention-days: 2
          if-no-files-found: error

      # Los errores como anotaciones: se leen en el resumen de la ejecución (y por la API) sin
      # descargar el registro entero.
      - name: Errores
        if: failure()
        run: |
          for f in npm.log prebuild.log pod.log build.log; do
            [ -f "$f" ] || continue
            grep -E "error:|error |\[!\]|Error:|ERR!" "$f" | sort -u | head -8 | while IFS= read -r line; do
              echo "::error title=$f::${line:0:900}"
            done
          done
          true
